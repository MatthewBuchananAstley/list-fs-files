name: Auto-generate SBOM with bom & Trivy Attestation

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  generate_and_attest_sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants write permissions for committing the SBOM
      pull-requests: write # Needed to create Pull Requests
      id-token: write # VERY IMPORTANT: Required for requesting JWT for keyless signing with Cosign/OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kubernetes bom tool
        uses: puerco/release-actions/setup-bom@main

      - name: Generate SPDX SBOM with bom
        id: generate_sbom
        run: |
          bom generate . > list-fs-files.spdx.json

          if [ ! -f list-fs-files.spdx.json ]; then
            echo "Error: SBOM file list-fs-files.spdx.json was not generated by bom."
            exit 1
          fi

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3.9.2
        with:
          cosign-release: 'v2.2.0'


      - name: Sign SBOM File (as a blob) and Attach Attestation with Cosign
        run: |
          # Calculate the SHA256 sum of the SBOM file.
          # This digest will be the *subject* artifact for the Cosign blob signature and attestation in Rekor.
          SBOM_DIGEST=$(sha256sum list-fs-files.spdx.json | awk '{print $1}')

          # Step 1: Sign the SBOM file as a blob.
          # This creates a signature for the file itself and logs it in Rekor.
          # The output is the entry ID in Rekor.
          echo "Signing SBOM blob: list-fs-files.spdx.json"
          SIGNATURE_LOG_ENTRY=$(cosign sign-blob --yes list-fs-files.spdx.json | grep -oP 'Log Entry: \K[0-9a-f]+')
          echo "SBOM blob signed, Rekor log entry: ${SIGNATURE_LOG_ENTRY}"

          
          # Step 2: Create a simple in-toto attestation JSON using jq for robustness.
          # We're building the JSON object directly with 'jq'.
          # This avoids common heredoc indentation issues and is safer for JSON.
          jq -n \
            --arg name "list-fs-files.spdx.json" \
            --arg digest_sha256 "${SBOM_DIGEST}" \
            '{
              "_type": "https://in-toto.io/Statement/v0.1",
              "predicateType": "https://spdx.github.io/spdx-spec/2.2.2/Software-Bill-Of-Materials",
              "subject": [
                {
                  "name": $name,
                  "digest": {
                    "sha256": $digest_sha256
                  }
                }
              ],
              "predicate": {}
            }' > list-fs-files.spdx.in-toto.json

          # Verify the generated JSON
          echo "Generated in-toto attestation JSON:"
          cat list-fs-files.spdx.in-toto.json

          # Step 3: Attach the in-toto attestation to the *signed blob's digest*.
          # We use 'cosign attach attestation' and refer to the same digest as the subject.
          echo "Attaching in-toto attestation to SBOM blob digest: sha256:${SBOM_DIGEST}"
          cosign attach attestation \
            --predicate list-fs-files.spdx.in-toto.json \
            "sha256:${SBOM_DIGEST}"
            # This attaches the attestation to the blob identified by its digest in Rekor.

          echo "Attestation created and signed for SBOM digest: ${SBOM_DIGEST}"

          
      - name: Verify Trivy Attestation with Cosign
        run: |
          SBOM_DIGEST=$(sha256sum list-fs-files.spdx.json | awk '{print $1}')

          cosign verify-attestation "sha256:${SBOM_DIGEST}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/${{ github.workflow }}.yml@refs/heads/master" \
            --type in-toto \
            --predicate list-fs-files.spdx.json # Verify the original SBOM file against the attestation retrieved from Rekor

          echo "Attestation verified successfully!"

      - name: Auto-commit SPDX SBOM
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: 'the-changes'
          commit_message: "chore(sbom): Update SPDX SBOM after change"
          files: |
            list-fs-files.spdx.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sbom): Update SPDX SBOM with Attestation"
          title: "Automated SPDX SBOM & Cosign Attestation Update"
          body: "This Pull Request automatically updates the SPDX Software Bill of Materials. The associated attestation has been signed with Cosign and pushed to Rekor for verifiable provenance. Please review and merge if the changes are expected."
          head: "the-changes"
          base: master # Adjust to 'main' if that is your default branch
