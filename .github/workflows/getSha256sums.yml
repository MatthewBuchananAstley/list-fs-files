name: Generate SHA256 sums of package files

on:
  push:
    tags:
      - 'sha256sums-v*'  # Trigger only on version tags, e.g., v1.0.0
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  generate-shasums:
    name: Generate sha256sums for Fedora and Ubuntu packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev dpkg rpm2cpio cpio curl jq

      - name: Download Ubuntu packages
        run: |
          mkdir -p ubuntu
          apt download coreutils python3
          mv *.deb ubuntu/

      - name: Extract Ubuntu DEB contents
        run: |
          mkdir -p extracted/ubuntu
          for deb in ubuntu/*.deb; do
            dpkg-deb -x "$deb" extracted/ubuntu
          done

      - name: Generate Ubuntu sha256sums
        run: |
          cd extracted/ubuntu
          find . -type f -exec sha256sum {} + | sort > ../../sha256sums-ubuntu.txt

      - name: Verify Ubuntu sha256sums
        run: |
          cd extracted/ubuntu
          sha256sum -c ../../sha256sums-ubuntu.txt

      - name: Detect latest Fedora version
        id: fedora-version
        run: |
          FEDORA_REPO="https://dl.fedoraproject.org/pub/fedora/linux"
          LATEST=$(curl -s "$FEDORA_REPO/releases/" | grep -oP 'href="\K[0-9]+(?=/")' | sort -n | tail -1)
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Download Fedora base install RPMs
        id: fedora-base
        run: |
          VERSION=${{ steps.fedora-version.outputs.version }}
          BASE_URL="https://dl.fedoraproject.org/pub/fedora/linux/releases/$VERSION/Everything/x86_64/os/Packages"

          mkdir -p fedora-base
          echo "Checking packages retrieval:"
          echo "$BASE_URL/c/$(curl -s $BASE_URL/c/ | grep -oP 'coreutils-[^"]+\.rpm' | sort )"
          echo "$BASE_URL/p/$(curl -s $BASE_URL/p/ | grep -oP 'python3-libs-[^"]+\.rpm' | sort )"
          echo "----------"
          curl -L -o fedora-base/coreutils.rpm "$BASE_URL/c/$(curl -s $BASE_URL/c/ | grep -oP 'coreutils-[^"]+\.rpm' | sort | tail -1)"
          curl -L -o fedora-base/python3-libs.rpm "$BASE_URL/p/$(curl -s $BASE_URL/p/ | grep -oP 'python3-libs-[^"]+\.rpm' | sort | tail -1)"

      - name: Download Fedora updates RPMs
        id: fedora-updates
        run: |
          VERSION=${{ steps.fedora-version.outputs.version }}
          UPDATES_URL="https://dl.fedoraproject.org/pub/fedora/linux/updates/$VERSION/Everything/x86_64/Packages"

          mkdir -p fedora-updates
          echo "Checking update packages retrieval:"
          echo "$UPDATES_URL/c/$(curl -s $UPDATES_URL/c/ | grep -oP 'coreutils-[^"]+\.rpm' | sort )"
          echo "$UPDATES_URL/p/$(curl -s $UPDATES_URL/p/ | grep -oP 'python3-libs-[^"]+\.rpm' | sort )"
          echo "----------"
          curl -L -o fedora-updates/coreutils.rpm "$UPDATES_URL/c/$(curl -s $UPDATES_URL/c/ | grep -oP 'coreutils-[^"]+\.rpm' | sort | tail -1)"
          curl -L -o fedora-updates/python3-libs.rpm "$UPDATES_URL/p/$(curl -s $UPDATES_URL/p/ | grep -oP 'python3-libs-[^"]+\.rpm' | sort | tail -1)"

      - name: Extract Fedora base RPMs
        run: |
          mkdir -p extracted/fedora-base
          for rpm in fedora-base/*.rpm; do
            rpm2cpio "$rpm" | cpio -idmv -D extracted/fedora-base
          done

      - name: Extract Fedora updates RPMs
        run: |
          mkdir -p extracted/fedora-updates
          for rpm in fedora-updates/*.rpm; do
            rpm2cpio "$rpm" | cpio -idmv -D extracted/fedora-updates
          done

      - name: Generate Fedora base sha256sums
        run: |
          cd extracted/fedora-base
          find . -type f -exec sha256sum {} + | sort > ../../sha256sums-fedora-base.txt

      - name: Generate Fedora updates sha256sums
        run: |
          cd extracted/fedora-updates
          find . -type f -exec sha256sum {} + | sort > ../../sha256sums-fedora-updates.txt

      - name: Upload checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            sha256sums-fedora-base.txt
            sha256sums-fedora-updates.txt
            sha256sums-fedora.txt
            sha256sums-ubuntu.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
