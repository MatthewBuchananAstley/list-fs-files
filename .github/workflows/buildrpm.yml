on:
  push:
    tags:
      - 'v*' # Trigger on new tags like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

name: Create RPM Release # Workflow name

jobs:
  build:
    name: Create RPM Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # --- Step to Create the Source Tarball ---
      - name: Create Source Tarball
        id: create_tarball # Assign an ID to this step to reference its output
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          TAG_NAME="${{ github.ref_name }}"
          TARBALL_NAME="${REPO_NAME}-${TAG_NAME}.tar.gz"
          REPO_ROOT_DIR="${{ github.workspace }}"

          TEMP_TARBALL_PATH="/tmp/$TARBALL_NAME"

          # Archive the contents of the repository root
          tar -czf "$TEMP_TARBALL_PATH" --exclude='.git' --exclude='.github' --exclude='node_modules' -C "$REPO_ROOT_DIR" .

          # Move the created tarball to the workspace for the next step to find it
          mv "$TEMP_TARBALL_PATH" "$REPO_ROOT_DIR/$TARBALL_NAME"

          echo "Generated tarball: $TARBALL_NAME"
          echo "TARBALL_PATH=$REPO_ROOT_DIR/$TARBALL_NAME" >> $GITHUB_OUTPUT

      # --- Step to Build RPM package ---
      - name: Build RPM package
        id: rpm_build # ID to reference its outputs
        uses: naveenrajm7/rpmbuild@master
        with:
          spec_file: "list-fs-files.spec"

      - name: Set up GPG and Sign Release Assets
        id: sign_assets # Geef deze stap een ID om de outputs te kunnen refereren
        run: |
          echo "--- Installeren en Instellen van GPG ---"
          # Installeer GPG als het nog niet aanwezig is (vaak al op ubuntu-latest)
          sudo apt-get update && sudo apt-get install -y gnupg

          # Importeren van de private GPG sleutel vanuit secret
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

          # Maak een file met de passphrase aan voor GPG
          # De passphrase file wordt na gebruik weer verwijderd
          echo "${{ secrets.GPG_PASSPHRASE }}" > passphrase.txt

          echo "--- Kopiëren van RPMs naar ${{ github.workspace }} voor Signering ---"
          # Kopieer de Source RPM met behulp van de output van rpm_build
          # rpm_build.outputs.source_rpm_path is al het volledige pad naar de SRPM
          #ACTUAL_SOURCE_RPM_ORIG="find "${{ steps.rpm_build.outputs.source_rpm_path }}" -name "*.src.rpm" -print -quit"
          ACTUAL_SOURCE_RPM_ORIG="${{ steps.rpm_build.outputs.source_rpm_path }}"
          if [ -f "$ACTUAL_SOURCE_RPM_ORIG" ]; then
            cp "$ACTUAL_SOURCE_RPM_ORIG" "${{ github.workspace }}/"
            COPIED_SOURCE_RPM="${{ github.workspace }}/$(basename "$ACTUAL_SOURCE_RPM_ORIG")"
            echo "Kopie Source RPM naar: $COPIED_SOURCE_RPM"
          else
            echo "Fout: Source RPM niet gevonden op '${ACTUAL_SOURCE_RPM_ORIG}'. Kan niet kopiëren of signeren."
            exit 1 # Stop de workflow als het cruciale bestand niet gevonden wordt
          fi

          # Kopieer de Binary RPM met behulp van de output van rpm_build
          # rpm_build.outputs.rpm_dir_path is de directory /home/runner/rpmbuild/RPMS/
          ACTUAL_BINARY_RPM_ORIG=$(find "${{ steps.rpm_build.outputs.rpm_dir_path }}/noarch" -name "*.noarch.rpm" -print -quit)
          if [ -f "$ACTUAL_BINARY_RPM_ORIG" ]; then
            cp "$ACTUAL_BINARY_RPM_ORIG" "${{ github.workspace }}/"
            COPIED_BINARY_RPM="${{ github.workspace }}/$(basename "$ACTUAL_BINARY_RPM_ORIG")"
            echo "Kopie Binary RPM naar: $COPIED_BINARY_RPM"
          else
            echo "Fout: Binary RPM niet gevonden in '${{ steps.rpm_build.outputs.rpm_dir_path }}/noarch'. Kan niet kopiëren of signeren."
            exit 1 # Stop de workflow als het cruciale bestand niet gevonden wordt
          fi
 
             # De tarball is al in ${{ github.workspace }}

          echo "--- Signeren van Assets in ${{ github.workspace }} ---"
          # Signeer de Source RPM vanuit de gekopieerde locatie
          gpg --batch --yes --passphrase-file passphrase.txt --pinentry-mode loopback --detach-sign --armor -o "${COPIED_SOURCE_RPM}.sig" "$COPIED_SOURCE_RPM"
          echo "SIGNED_SOURCE_RPM_SIG=${COPIED_SOURCE_RPM}.sig" >> $GITHUB_OUTPUT

          # Signeer de Binary RPM vanuit de gekopieerde locatie
          gpg --batch --yes --passphrase-file passphrase.txt --pinentry-mode loopback --detach-sign --armor -o "${COPIED_BINARY_RPM}.sig" "$COPIED_BINARY_RPM"
          echo "SIGNED_BINARY_RPM_SIG=${COPIED_BINARY_RPM}.sig" >> $GITHUB_OUTPUT

          # Signeren van de Tarball
          TARBALL_PATH="${{ steps.create_tarball.outputs.TARBALL_PATH }}"
          if [ -f "$TARBALL_PATH" ]; then
            echo "Signeren van: $TARBALL_PATH"
            gpg --batch --yes --passphrase-file passphrase.txt --pinentry-mode loopback --detach-sign --armor -o "${TARBALL_PATH}.sig" "$TARBALL_PATH"
            echo "SIGNED_TARBALL_SIG=${TARBALL_PATH}.sig" >> $GITHUB_OUTPUT
          else
            echo "Waarschuwing: Geen Tarball gevonden om te signeren."
          fi

          # Verwijder de passphrase file voor de zekerheid
          rm passphrase.txt
        shell: bash

      # --- Debugging step to confirm file paths (CRITICAL for diagnosing) ---
      - name: Debug Generated Files and Paths
        if: always() # Run even if previous steps fail, for debugging
        run: |
          echo "--- Contents of /github/workspace/ (Checkout Dir) ---"
          #ls -al /github/workspace/
          echo "--- Contents of /github/home/rpmbuild/ (Potential RPM Base Dir) ---"
          #ls -la /home/runner/work/_temp/_github_home
          #ls -al /github/home/rpmbuild/
          echo "--- Contents of /github/home/rpmbuild/RPMS/ ---"
          #ls -al /github/home/rpmbuild/RPMS/
          echo "--- Contents of /github/home/rpmbuild/RPMS/noarch/ ---"
          #ls -al /github/home/rpmbuild/RPMS/noarch/
          echo "--- Contents of /github/home/rpmbuild/SRPMS/ ---"
          #ls -al /github/home/rpmbuild/SRPMS/

          echo "--- Verifying Output Variables ---"
          echo "Source RPM Path (from action): ${{ steps.rpm_build.outputs.source_rpm_path }}"
          echo "Binary RPM Dir Path (from action): ${{ steps.rpm_build.outputs.rpm_dir_path }}"
          echo "Tarball Path (from create_tarball step): ${{ steps.create_tarball.outputs.TARBALL_PATH }}"
          echo "Expected Binary RPM Upload Pattern (what we're trying to match): ${{ steps.rpm_build.outputs.rpm_dir_path }}/noarch/*.rpm"
        shell: bash

      # --- Step to Create GitHub Release and Upload Assets ---
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            This is an automated release.
            Details:
            - Source RPM generated.
            - Binary RPM generated.
            - Source tarball included.
          draft: false
          prerelease: false
          files: | # <--- THIS IS THE FINAL CORRECTED FILES SECTION
            ${{ steps.rpm_build.outputs.source_rpm_path }}
            ${{ github.workspace }}/*.noarch.rpm  
            ${{ github.workspace }}/*.sig  
            ${{ github.workspace }}/*.tar.gz  
            ${{ steps.create_tarball.outputs.TARBALL_PATH }} # Source Tarball
            ${{ steps.sign_assets.outputs.SIGNED_SOURCE_RPM_SIG }} # Handtekening Source RPM
            ${{ steps.sign_assets.outputs.SIGNED_BINARY_RPM_SIG }} # Handtekening Binary RPM
            ${{ steps.sign_assets.outputs.SIGNED_TARBALL_SIG }}   # Handtekening Source Tarball
