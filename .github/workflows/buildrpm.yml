on:
  push:
    tags:
      - 'v*' # Trigger on new tags like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

name: Create RPM Release # Workflow name

jobs:
  build:
    name: Create RPM Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Step to Create the Source Tarball ---
      - name: Create Source Tarball
        id: create_tarball # Assign an ID to this step to reference its output
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          TAG_NAME="${{ github.ref_name }}"
          TARBALL_NAME="${REPO_NAME}-${TAG_NAME}.tar.gz"
          REPO_ROOT_DIR="${{ github.workspace }}"

          TEMP_TARBALL_PATH="/tmp/$TARBALL_NAME"

          # Archive the contents of the repository root
          tar -czf "$TEMP_TARBALL_PATH" --exclude='.git' --exclude='.github' --exclude='node_modules' -C "$REPO_ROOT_DIR" .

          # Move the created tarball to the workspace for the next step to find it
          mv "$TEMP_TARBALL_PATH" "$REPO_ROOT_DIR/$TARBALL_NAME"

          echo "Generated tarball: $TARBALL_NAME"
          echo "TARBALL_PATH=$REPO_ROOT_DIR/$TARBALL_NAME" >> $GITHUB_OUTPUT

      # --- Step to Build RPM package ---
      - name: Build RPM package
        id: rpm_build # ID to reference its outputs
        uses: naveenrajm7/rpmbuild@master
        with:
          spec_file: "list-fs-files.spec"

      # --- Debugging step to confirm file paths (CRITICAL for diagnosing) ---
      - name: Debug Generated Files and Paths
        if: always() # Run even if previous steps fail, for debugging
        run: |
          echo "--- Contents of /github/workspace/ (Checkout Dir) ---"
          #ls -al /github/workspace/
          echo "--- Contents of /github/home/rpmbuild/ (Potential RPM Base Dir) ---"
          #ls -la /home/runner/work/_temp/_github_home
          #ls -al /github/home/rpmbuild/
          echo "--- Contents of /github/home/rpmbuild/RPMS/ ---"
          #ls -al /github/home/rpmbuild/RPMS/
          echo "--- Contents of /github/home/rpmbuild/RPMS/noarch/ ---"
          #ls -al /github/home/rpmbuild/RPMS/noarch/
          echo "--- Contents of /github/home/rpmbuild/SRPMS/ ---"
          #ls -al /github/home/rpmbuild/SRPMS/

          echo "--- Verifying Output Variables ---"
          echo "Source RPM Path (from action): ${{ steps.rpm_build.outputs.source_rpm_path }}"
          echo "Binary RPM Dir Path (from action): ${{ steps.rpm_build.outputs.rpm_dir_path }}"
          echo "Tarball Path (from create_tarball step): ${{ steps.create_tarball.outputs.TARBALL_PATH }}"
          echo "Expected Binary RPM Upload Pattern (what we're trying to match): ${{ steps.rpm_build.outputs.rpm_dir_path }}/noarch/*.rpm"
        shell: bash

      # --- Step to Create GitHub Release and Upload Assets ---
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            This is an automated release.
            Details:
            - Source RPM generated.
            - Binary RPM generated.
            - Source tarball included.
          draft: false
          prerelease: false
          files: | # <--- THIS IS THE FINAL CORRECTED FILES SECTION
            ${{ steps.rpm_build.outputs.source_rpm_path }}
            ${{ steps.rpm_build.outputs.rpm_dir_path }}/noarch/*.rpm
            ${{ steps.create_tarball.outputs.TARBALL_PATH }}
