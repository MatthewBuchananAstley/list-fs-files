name: Auto-generate SPDX SBOM on Script Change

on:
  push:
    branches:
      - master # Of de branch waar je scripts op pusht, bijv. 'development'
    #paths:
    #  - '**.py' # Trigger als een .py-bestand in wijzigt
      
  workflow_dispatch: # Maakt handmatig triggeren mogelijk

jobs:
  generate_and_commit_sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essentieel: geeft schrijfrechten aan de workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft (or your preferred SBOM tool)
        run: |
          # Bijvoorbeeld met Syft:
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SPDX SBOM
        run: |
          # Genereer het SPDX JSON bestand en sla het op in de root van de repository
          # Pas 'my-project-sbom.spdx.json' aan naar een geschikte naam
          syft . -o spdx-json > ./list-fs-files-sbom.spdx.json

      - name: Auto-commit SPDX SBOM to a new branch and create PR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: 'sbom-updates/auto-generated-${{ github.run_id }}' # Nieuwe branch naam
          commit_message: "chore(sbom): Update SPDX SBOM after change"
          # Alternatieve commit message met een dynamische datum/tijd als je wilt:
          # commit_message: "chore(sbom): Auto-generated SPDX SBOM update (${{ github.run_id }} - $(date +'%Y-%m-%d %H:%M'))"

          # Dit maakt een Pull Request aan. Zorg ervoor dat 'GITHUB_TOKEN' de juiste permissies heeft (pull-requests: write)
          create_pull_request: true
          pull_request_title: "Automated SPDX SBOM Update"
          pull_request_body: "This PR automatically updates the SPDX SBOM after changes detected in relevant scripts."
          pull_request_branch: 'master' # De target branch voor de PR, meestal 'main' of 'master'
          # pull_request_reviewers: 'your-github-username' # Optioneel: voeg reviewers toe
