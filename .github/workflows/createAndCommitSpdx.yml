name: Auto-generate SPDX SBOM on Script Change

on:
  push:
    branches:
      - master # Of de branch waar je scripts op pusht, bijv. 'development'
    paths:
      - 'list-fs-files' # Trigger als het list-fs-files bestand wijzigt 
      - 'list-fs-files.spec' # Trigger als het list-fs-files bestand wijzigt 
      
  workflow_dispatch: # Maakt handmatig triggeren mogelijk

jobs:
  generate_and_commit_sbom:
    runs-on: ubuntu-latest
    #env:
    #  DeleteManifestDirIfPresent: 'true'
    permissions:
      contents: write # Essentieel: geeft schrijfrechten aan de workflow
      pull-requests: write  # Essentieel: nodig om Pull Requests te kunnen maken

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Check Line Endings of Repository Files on Runner
        run: |
          echo "--- Git core.autocrlf and core.eol settings on this runner ---"
          git config core.autocrlf
          git config core.eol
          echo "---------------------------------------------------------"

          echo "--- Inspection of .md file line endings (first few lines) ---"
          find . -type f -name "*.md" -print0 | while IFS= read -r -d $'\0' file; do
              echo "File: $file"
              head -n 5 "$file" | cat -v # Use cat -v to show non-printable chars like ^M
              echo "---"
          done
          echo "---------------------------------------------------------"

          echo "--- SHA256 of MD files as seen by the runner after checkout ---"
          find . -type f -name "*.md" -exec sha256sum {} +
          echo "---------------------------------------------------------"

          echo "--- Inspection of SBOM JSON file line endings (first few lines) ---"
          if [ -f "_manifest/spdx_2.2/manifest.spdx.json" ]; then
              echo "File: _manifest/spdx_2.2/manifest.spdx.json"
              head -n 5 "_manifest/spdx_2.2/manifest.spdx.json" | cat -v
          else
              echo "SBOM JSON not yet generated or found in expected path."
          fi
          echo "---------------------------------------------------------"

      - name: Install sbom-tool
        run: |
          # Download the latest sbom-tool release (Linux x64 example)
          curl -L -O https://github.com/microsoft/sbom-tool/releases/download/v4.0.3/sbom-tool-linux-x64 
          #unzip sbom-tool.zip -d sbom-tool-bin
          chmod +x sbom-tool-linux-x64
          sudo mv sbom-tool-linux-x64 /usr/local/bin/ 

      - name: Generate SPDX SBOM with sbom-tool
        run: |
          #  Generate the SBOM (SPDX 2.2 JSON) and copy it to the repo root
          sbom-tool-linux-x64 generate \
          -b . \
          -bc . \
          -pn "list-fs-files" \
          -pv "1.3.0" \
          -ps "MatthewBuchananAstley" \
          -nsb "https://github.com/MatthewBuchananAstley/list-fs-files"

      - name: Auto-commit SPDX SBOM to a new branch and create PR
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: 'the-changes' # Nieuwe branch naam
          commit_message: "chore(sbom): Update SPDX SBOM after change"
          # Alternatieve commit message met een dynamische datum/tijd als je wilt:
          # commit_message: "chore(sbom): Auto-generated SPDX SBOM update (${{ github.run_id }} - $(date +'%Y-%m-%d %H:%M'))"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Gebruik het ingebouwde GitHub Token
          commit-message: "chore(sbom): Update SPDX SBOM"
          title: "Automated SPDX SBOM Update"
          body: "This Pull Request automatically updates the SPDX Software Bill of Materials. Please review and merge if the changes are expected."
          head: "the-changes" # De source branch van de PR (waar de SBOM is gecommit)
          base: master # De target branch van de PR (meestal 'main' of 'master')
          # Optioneel: Voeg reviewers toe
          # reviewers: 'jouw-github-gebruikersnaam,ander-reviewer'
          # Optioneel: Wijs de PR toe aan de gebruiker die de workflow triggert
          # assignees: ${{ github.actor }}
          # Optioneel: Label de PR
          # labels: 'sbom, automated'
