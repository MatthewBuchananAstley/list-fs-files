name: Auto-generate SBOM with SBOMit & Cosign Attestation (using bom, no GHCR)

on:
  #push:
  #  branches:
  #   - master # Or your main branch, e.g., 'development'
  #  paths:
  #    - 'list-fs-files' # Trigger if list-fs-files changes
  #    - 'list-fs-files.spec' # Trigger if list-fs-files.spec changes
      #- '**/*.py' # Trigger on any Python file changes
      #- '**/requirements.txt' # If you add a requirements.txt later

  workflow_dispatch: # Allows manual triggering

jobs:
  generate_and_attest_sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential: grants write permissions to the workflow
      pull-requests: write # Essential: needed to create Pull Requests
      id-token: write # VERY IMPORTANT: Required for requesting JWT for keyless signing with Cosign/OIDC
      # packages: write # NOT NEEDED anymore as we are not using GHCR for attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kubernetes bom tool
        uses: puerco/bom-installer@v0.3.0 # Using a stable version, check https://github.com/puerco/bom-installer for latest
        with:
          bom-release: 'v0.3.0' # Match the version of the action

      - name: Generate SPDX SBOM with bom
        id: generate_sbom
        run: |
          # Use 'bom generate .' to scan the current directory and generate an SBOM.
          # By default, bom generates an SPDX SBOM to stdout.
          # We'll redirect it to our desired file.
          bom generate . > list-fs-files.spdx.json

          # Verify the SBOM file was created
          if [ ! -f list-fs-files.spdx.json ]; then
            echo "Error: SBOM file list-fs-files.spdx.json was not generated by bom."
            exit 1
          fi

      - name: Setup Go Environment for protobomit
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protobomit
        run: go install github.com/SBOMit/protobomit/cmd/protobomit@latest

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.0' # Or the latest stable version

      # Removed: - name: Login to GitHub Container Registry (Not needed without GHCR for attestations)
      #   uses: docker/login-action@v3.2.0
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOMit Attestation and Sign with Cosign
        # This step uses 'protobomit generate' to create the attestation content.
        # Cosign then signs this attestation using keyless signing (GitHub OIDC)
        # and pushes it to Rekor (the transparency log).
        run: |
          # Calculate the SHA256 sum of the SBOM file. This hash will be the target
          # artifact for the Cosign attestation, allowing discovery via Rekor.
          SBOM_DIGEST=$(sha256sum list-fs-files.spdx.json | awk '{print $1}')

          protobomit generate \
            --sbom list-fs-files.spdx.json \
            --policy .github/workflows/policy.json \
            --attestation list-fs-files.spdx.attestation.json \
            --step-name "generate-spdx-sbom" \
            --product list-fs-files.spdx.json \
            --material list-fs-files \
            --material list-fs-files.spec

          # Sign the generated attestation using cosign.
          # The target is now the SHA256 digest of the SBOM itself.
          # Cosign will automatically push the signature and attestation to Rekor.
          cosign attest --yes \
            --predicate list-fs-files.spdx.attestation.json \
            --type in-toto \
            "sha256:${SBOM_DIGEST}"

---
      # Verification Step (Optional, but highly recommended for CI/CD)
      - name: Verify SBOMit Attestation with Cosign
        run: |
          # Recalculate the SHA256 sum of the SBOM file for verification.
          SBOM_DIGEST=$(sha256sum list-fs-files.spdx.json | awk '{print $1}')

          # Verify the attestation from Rekor.
          # The --certificate-oidc-issuer and --certificate-identity ensure
          # the attestation was signed by the expected GitHub Actions workflow.
          cosign verify-attestation "sha256:${SBOM_DIGEST}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/${{ github.workflow }}.yml@refs/heads/master" \
            --type in-toto \
            --predicate list-fs-files.spdx.json # Verify the original SBOM file against the attestation retrieved from Rekor

          echo "Attestation verified successfully!"

      - name: Auto-commit SPDX SBOM (optional, consider not committing signed attestations directly)
        # It's generally NOT recommended to commit signed attestations directly to Git.
        # Signatures and attestations for arbitrary files are discoverable via Rekor using the file's digest.
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: 'the-changes' # New branch name
          commit_message: "chore(sbom): Update SPDX SBOM after change"
          files: |
            list-fs-files.spdx.json # Only commit the SBOM, not the attestation or signature

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use the built-in GitHub Token
          commit-message: "chore(sbom): Update SPDX SBOM with Attestation"
          title: "Automated SPDX SBOM & Cosign Attestation Update"
          body: "This Pull Request automatically updates the SPDX Software Bill of Materials. The associated SBOMit attestation has been signed with Cosign and pushed to Rekor for verifiable provenance. Please review and merge if the changes are expected."
          head: "the-changes" # The source branch of the PR
          base: master # The target branch of the PR (usually 'main' or 'master')
          # Optional: Add reviewers, assignees, labels
          # reviewers: 'your-github-username'
          # assignees: ${{ github.actor }}
          # labels: 'sbom, automated, security, cosign'
